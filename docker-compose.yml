# ============================================================
# 家庭病历档案管理系统 - Docker Compose（极空间/通用版）
# 部署包版本：v12.2（2026-10-12）
#   版本内容：人员详情页（编辑个人信息+删除两次确认）、当前用药、软删除、健康检查加固、
#             端口 18080:80、
#             密钥自动持久化到数据库（data/db）：整体覆盖 zip 升级后自动找回真实密钥；
#             镜像标签跟随版本号（family-files-backend:v12），构建结果一眼可辨；
#             npm 安装显示实时进度 + 快速超时重试（120s），构建过程可见、不再'假卡死'；
#             首页点击头像进入人员详情页；全部保存/删除按钮防重复提交（loading+禁用）
#   升级说明：
#     1) 【必做】升级/重建前，先把项目目录下的 data/ 文件夹【复制备份】到项目目录外；
#     2) 【升级方式】只替换 backend、frontend、docker-compose.yml 等代码文件，
#        保留 data/ 文件夹（数据库、上传文件、密钥都在里面）；
#        【不要】整个文件夹删除后重传——那样 data/ 会丢失；
#     3) 密钥：首次在 data/backend.env 填写，之后升级不再需要修改；
#     4) 数据库迁移会在容器启动时自动执行（migrate deploy，幂等）。
# ============================================================
# 用法（极空间）：把本 zip 解压后，整个 family-files 文件夹上传到极空间；
#   在 Docker → Compose/项目 → 新建项目 → 用【选择文件】选中本文件（family-files/docker-compose.yml）
#   极空间会以本文件所在目录为项目根，backend/frontend 子目录即构建上下文。
# 密钥不再写在 compose 里，统一放 data/backend.env（首次填一次即可）：
#   1. JWT_SECRET            → 任意长随机字符串（建议更换）
#   2. OCR_API_KEY           → 你的 DeepSeek API Key（sk- 开头，病历图片识别用）
#   3. SEED_ADMIN_PASSWORD   → 初始管理员密码（登录账号固定为 admin）
# 本文件是模板（data/backend.env.example 风格），zip 内已带 data/backend.env
services:
  backend:
    build: ./backend
    image: family-files-backend:v12.2
    restart: unless-stopped
    # 密钥统一从 data/backend.env 读取（data/ 是保留目录，升级/重建不丢，
    # 密钥只填一次；其余非敏感配置仍写在 environment 里）
    env_file:
      - ./data/backend.env
    environment:
      # 数据固定写入项目目录下 data/ 文件夹，升级镜像/重建容器不丢数据
      DATABASE_URL: "file:/data/db/dev.db"
      UPLOAD_DIR: "/data/uploads"
      JWT_EXPIRES_IN: "7d"
      PORT: "3000"
      LEAD_DAYS: "30"
      OCR_API_BASE: "https://api.deepseek.com"
      OCR_MODEL: "deepseek-chat"
    volumes:
      - ./data/db:/data/db
      - ./data/uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      # ARM 芯片冷启动较慢：放宽启动窗口与重试，避免健康检查误判
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  frontend:
    build: ./frontend
    image: family-files-frontend:v12.2
    restart: unless-stopped
    ports:
      - "18080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
