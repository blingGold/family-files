# 家庭病历档案管理系统 - 极空间 Docker Compose 专用版
# 用法：在极空间 Docker 的 "Compose / 项目" 功能中粘贴本文件内容，或选择本项目目录下的本文件
# 注意：环境变量已内联（无需 .env 文件），部署前把下面 3 个 CHANGE_ME 值替换为你自己的：
#   1. JWT_SECRET            → 任意长随机字符串（可用浏览器在线生成，或保持默认亦可，建议更换）
#   2. OCR_API_KEY           → 你的 DeepSeek API Key（sk- 开头，用于病历图片识别）
#   3. SEED_ADMIN_PASSWORD   → 初始管理员密码（登录账号固定为 admin）
services:
  backend:
    build: ./backend
    image: family-files-backend:latest
    restart: unless-stopped
    environment:
      # 数据固定写入项目目录下的 data/ 文件夹，升级镜像/重建容器都不丢数据
      DATABASE_URL: "file:/data/db/dev.db"
      UPLOAD_DIR: "/data/uploads"
      JWT_SECRET: "CHANGE_ME_JWT_SECRET"
      JWT_EXPIRES_IN: "7d"
      PORT: "3000"
      LEAD_DAYS: "30"
      OCR_API_BASE: "https://api.deepseek.com"
      OCR_API_KEY: "CHANGE_ME_OCR_API_KEY"
      OCR_MODEL: "deepseek-chat"
      SEED_ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
    volumes:
      - ./data/db:/data/db
      - ./data/uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    image: family-files-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
